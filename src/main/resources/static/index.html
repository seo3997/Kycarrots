<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>asagong - 프리미엄 농수산물 직거래 플랫폼</title>
    <style>
        :root {
            --primary: #ff6b35;
            --dark: #011627;
            --light: #fdfffc;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            height: 100%;
            background-color: var(--light);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 40px;
        }

        .logo {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            color: var(--dark);
            font-weight: 700;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #666;
            margin-bottom: 40px;
        }

        .btn {
            display: inline-block;
            padding: 16px 45px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            background-color: var(--primary);
            color: white;
            box-shadow: 0 10px 20px rgba(255, 107, 53, 0.3);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 107, 53, 0.4);
        }

        .loading-dots:after {
            content: ' .';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ' .'; }
            40% { content: ' . .'; }
            60% { content: ' . . .'; }
            80%, 100% { content: ''; }
        }
    </style>
    <script>
        (function() {
            const host = window.location.hostname;
            // 본사 도메인이거나 로컬호스트인 경우
            if (host === 'www.asagong.com' || host === 'asagong.com' || 
                host === 'localhost' || host === '127.0.0.1') {
                window.location.replace('/front_index.do');
            } else {
                // 하위 지점 도메인
                window.location.replace('/shop/list.do');
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <div class="logo">🥕 asagong</div>
        <h1>신선함을 직거래하다</h1>
        <p>전국의 우수한 농산물을 가장 빠르게 만나보세요.<br>가장 투명하고 건강한 거래가 시작됩니다.</p>
        <a href="/front_index.do" class="btn">시작하기</a>
    </div>
</body>
</html>
